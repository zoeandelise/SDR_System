# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.SDR_System: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.SDR_System.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 智能饮食推荐系统配置
diet:
  # AI服务配置
  ai:
    # AI识别服务地址
    recognition-url: http://localhost:5000/api/recognition
    # 连接超时时间(毫秒)
    connect-timeout: 5000
    # 读取超时时间(毫秒)
    read-timeout: 30000
    # 最大重试次数
    max-retry: 3
    # Mock服务开关（开发测试时使用）
    mock:
      enabled: true
  # 推荐算法配置
  recommendation:
    # 推荐算法类型 (rule:规则引擎, collaborative:协同过滤, hybrid:混合推荐)
    algorithm-type: hybrid
    # 每日推荐次数
    daily-count: 3
    # 推荐有效期(小时)
    validity-hours: 24
  # 文件上传配置
  upload:
    # 食物图片上传路径
    food-image-path: /diet/food/images/
    # 允许的文件类型
    allowed-extensions: jpg,jpeg,png,gif,bmp
    # 单个文件最大大小(MB)
    max-file-size: 10

# 机器学习服务配置（V2.0 - 真实训练版）
ml:
  service:
    # ML服务地址
    url: http://localhost:8001
    # 请求超时时间(毫秒) - 增加到60秒以支持长时间训练
    timeout: 60000
    # 重试次数
    retry-attempts: 3
    # 服务启用开关
    enabled: true
  recommendation:
    # 推荐结果缓存时间(秒)
    cache-ttl: 3600
    # 批量推荐大小
    batch-size: 100
    # 最大推荐数量
    max-recommendations: 20
  model:
    # 模型自动重训练开关
    auto-retrain: false
    # 重训练间隔(小时)
    retrain-interval: 168
    # 最小训练数据量
    min-training-samples: 100
