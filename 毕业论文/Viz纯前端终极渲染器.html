<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>陈氏总体E-R图 本地极速渲染引擎</title>
    <!-- 使用 Viz.js (纯前端 Graphviz 引擎，不需要任何后端服务器) -->
    <script src="https://unpkg.com/viz.js@2.1.2/viz.js"></script>
    <script src="https://unpkg.com/viz.js@2.1.2/full.render.js"></script>
    <!-- 备份 CDN 容灾 -->
    <script>
        if (typeof Viz === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"><\/script>');
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"><\/script>');
        }
    </script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .right-panel {
            flex: 1;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        textarea {
            flex: 1;
            padding: 10px;
            font-family: Consolas, monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background: #0f3460;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1a1a2e;
        }

        button.btn-download {
            background: #e94560;
        }

        button.btn-download:hover {
            background: #c81d3f;
        }

        .tips {
            background: #e6f7ff;
            padding: 10px;
            border-left: 4px solid #1890ff;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error {
            color: #cf1322;
            font-weight: bold;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <h2>🚀 陈氏总体E-R图 本地纯前端渲染引擎 (替代 PlantUML)</h2>
    <div class="tips">
        <strong>突发状况：</strong> PlantUML 官方因为安全漏洞紧急封杀了 <code>@startdot</code> 接口（报错 issue #2495），所以在线官网无法再生成这种菱形 ER
        图。<br>
        <strong>终极解决方案：</strong> 我已经为你集成了纯前端的 <b>Viz.js 引擎</b>。它完全在你的浏览器里运行，不依赖任何外部服务器，<b>百分百零延迟、零乱码</b>！<br>
        <strong>用法：</strong> 复制文档中 <code>图3.21</code> (以 <code>@startdot</code> 开头的内容)，粘贴在左侧并渲染即可。
    </div>
    <div class="container">
        <div class="left-panel">
            <textarea id="pumlCode" placeholder="将 @startdot ... @enddot 的整段代码粘贴在这里..."></textarea>
            <div class="actions">
                <button onclick="renderSVG()">⚡ 立即本地渲染</button>
                <button class="btn-download" onclick="downloadImage()">⬇️ 下载透明高清PNG</button>
            </div>
        </div>
        <div class="right-panel">
            <div id="svgContainer" style="width: 100%; height: 100%; text-align: center;">
                <span style="color:gray;">渲染区域 (预览支持滚轮缩放)</span>
            </div>
        </div>
    </div>

    <script>
        function renderSVG() {
            if (typeof Viz === 'undefined') {
                alert('JS 引擎加载失败，请检查网络或切换全局 VPN。');
                return;
            }
            let code = document.getElementById('pumlCode').value.trim();
            if (!code) { alert('请输入代码！'); return; }

            // 智能提取 graph ER { ... } 或者 digraph { ... } 主体内容
            // 去除 @startdot 和 @enddot 等 PlantUML 包装标记
            code = code.replace(/@start(?:dot|uml)/g, '');
            code = code.replace(/@end(?:dot|uml)/g, '');
            // 去掉 markdown 代码块标记
            code = code.replace(/```plantuml/g, '');
            code = code.replace(/```/g, '');

            const container = document.getElementById('svgContainer');
            container.innerHTML = '<span style="color:gray">渲染中...</span>';

            const viz = new Viz();
            viz.renderSVGElement(code)
                .then(function (element) {
                    container.innerHTML = '';
                    element.style.maxWidth = '100%';
                    element.style.maxHeight = '100%';
                    container.appendChild(element);
                })
                .catch(error => {
                    viz = new Viz(); // handle possible memory leak on error
                    container.innerHTML = '<div class="error">语法错误或布局引擎报错：\n' + error + '</div>';
                });
        }

        function downloadImage() {
            const container = document.getElementById('svgContainer');
            const svgElement = container.querySelector('svg');
            if (!svgElement) { alert('请先点击渲染并生成成功！'); return; }

            const svgData = new XMLSerializer().serializeToString(svgElement);
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            // 为了超高清，放大 3 倍
            const scale = 3;
            // 获取 viewBox 以确保不会丢失原始尺寸信息
            const viewBox = svgElement.viewBox.baseVal;
            const width = viewBox.width || parseInt(svgElement.getAttribute('width'));
            const height = viewBox.height || parseInt(svgElement.getAttribute('height'));

            canvas.width = width * scale;
            canvas.height = height * scale;

            // 填充白色背景（防止透明背景在Word里变黑）
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.scale(scale, scale);

            const img = new Image();
            // 处理 SVG 中可能包含的非转义字符
            const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            img.onload = function () {
                ctx.drawImage(img, 0, 0);
                const a = document.createElement("a");
                a.download = "总体E-R图_超清.png";
                a.href = canvas.toDataURL("image/png");
                a.click();
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    </script>
</body>

</html>
