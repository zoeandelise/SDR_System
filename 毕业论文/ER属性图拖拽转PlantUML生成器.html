<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ER属性图 → PlantUML 生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Microsoft YaHei', SimSun, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #1a1a2e;
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .header h2 {
            font-size: 15px;
            margin-right: 4px;
        }

        .header select {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 4px;
            border: none;
            background: #16213e;
            color: white;
            cursor: pointer;
            min-width: 160px;
        }

        .header button {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-gen {
            background: #e94560;
            color: white;
        }

        .btn-copy {
            background: #0f3460;
            color: white;
        }

        .btn-png {
            background: #2d6a4f;
            color: white;
        }

        .btn-batch {
            background: #7b2fbf;
            color: white;
        }

        .btn-reset {
            background: #555;
            color: white;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #ccc;
        }

        .canvas-hint {
            background: #fffbe6;
            border-bottom: 1px solid #ffe58f;
            padding: 5px 12px;
            font-size: 12px;
            color: #7a5400;
            flex-shrink: 0;
        }

        #cvs {
            flex: 1;
            display: block;
            cursor: default;
            background: #fff;
        }

        .code-wrap {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            flex-shrink: 0;
        }

        .code-head {
            background: #252526;
            color: #9cdcfe;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        #codeOut {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 12px;
            line-height: 1.7;
            overflow-y: auto;
            white-space: pre;
            border: none;
            resize: none;
            width: 100%;
            outline: none;
        }

        .status {
            background: #007acc;
            color: white;
            font-size: 11px;
            padding: 3px 12px;
            flex-shrink: 0;
        }

        .legend {
            background: #f8f8f8;
            border-top: 1px solid #ddd;
            padding: 5px 12px;
            font-size: 11px;
            color: #555;
            flex-shrink: 0;
            display: flex;
            gap: 16px;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>ER属性图 → PlantUML</h2>
        <select id="sel" onchange="loadEntity(this.value)">
            <option value="user">1. 系统用户实体</option>
            <option value="health">2. 用户健康档案实体</option>
            <option value="foodcat">3. 食物分类实体</option>
            <option value="foodinfo">4. 食物信息实体</option>
            <option value="nutrition">5. 食物营养信息</option>
            <option value="record">6. 饮食记录实体</option>
            <option value="recommend">7. 推荐记录实体</option>
            <option value="goal">8. 健康目标实体</option>
            <option value="checkin">9. 饮食打卡实体</option>
            <option value="post">10. 社区动态实体</option>
            <option value="article">11. 科普资讯实体</option>
            <option value="favorites">12. 收藏记录实体</option>
            <option value="admin">13. 管理员实体</option>
        </select>
        <button class="btn-gen" onclick="generateCode()">⚡ 生成PlantUML代码</button>
        <button class="btn-copy" onclick="copyCode()">📋 复制代码</button>
        <button class="btn-png" onclick="downloadPNG()">🖼 下载PNG</button>
        <button class="btn-batch" onclick="batchExportAll(this)">📦 批量导出全部13张</button>
        <button class="btn-reset" onclick="resetLayout()">↺ 重置</button>
    </div>

    <div class="main">
        <div class="canvas-wrap">
            <div class="canvas-hint">💡 拖动椭圆到实体<b>上方</b>或<b>下方</b>，调好布局后点击"⚡生成PlantUML代码"</div>
            <canvas id="cvs"></canvas>
            <div class="legend">
                <span>
                    <div class="dot" style="background:#52c41a"></div>上方属性 → hidden箭头向下
                </span>
                <span>
                    <div class="dot" style="background:#faad14;border-radius:2px"></div>中心实体（固定）
                </span>
                <span>
                    <div class="dot" style="background:#1890ff"></div>下方属性 → hidden箭头向上
                </span>
            </div>
        </div>
        <div class="code-wrap">
            <div class="code-head">PlantUML代码 &nbsp;<span style="color:#888;font-weight:normal">复制后粘贴到
                    plantuml.com</span></div>
            <textarea id="codeOut" readonly placeholder="拖好布局后，点击 ⚡ 生成PlantUML代码..."></textarea>
            <div class="status" id="status">就绪 · 请选择实体</div>
        </div>
    </div>

    <script>
        const ENTITIES = {
            user: { name: "系统用户", attrs: ["用户ID", "用户名", "密码", "昵称", "邮箱", "手机号", "性别", "头像", "状态", "创建时间"] },
            health: { name: "用户健康档案", attrs: ["档案ID", "用户ID", "身高", "体重", "年龄", "目标体重", "基础代谢率", "每日推荐摄入热量", "是否糖尿病", "是否高血压", "是否痛风", "是否高血脂", "创建时间", "更新时间"] },
            foodcat: { name: "食物分类", attrs: ["分类ID", "分类名称", "排序号", "创建时间"] },
            foodinfo: { name: "食物信息", attrs: ["食物ID", "食物名称", "分类ID", "每百克热量", "蛋白质", "脂肪", "碳水化合物", "升糖指数", "嘌呤含量", "钠含量", "胆固醇", "数据来源", "创建时间"] },
            nutrition: { name: "食物营养信息", attrs: ["营养ID", "食物ID", "热量", "蛋白质", "脂肪", "碳水化合物", "膳食纤维", "钠", "胆固醇"] },
            record: { name: "饮食记录", attrs: ["记录ID", "用户ID", "食物ID", "就餐时段", "摄入克重", "摄入热量", "记录日期", "创建时间"] },
            recommend: { name: "推荐记录", attrs: ["推荐ID", "用户ID", "推荐食物列表", "算法类型", "是否被采纳", "创建时间"] },
            goal: { name: "健康目标", attrs: ["目标ID", "用户ID", "目标类型", "目标名称", "目标值", "当前值", "完成百分比", "状态", "创建时间"] },
            checkin: { name: "饮食打卡", attrs: ["打卡ID", "用户ID", "打卡日期", "饮食摘要", "总热量", "心情", "打卡心得", "创建时间"] },
            post: { name: "社区动态", attrs: ["动态ID", "用户ID", "正文内容", "图片链接", "点赞数", "评论数", "删除标记", "创建时间"] },
            article: { name: "科普资讯", attrs: ["文章ID", "标题", "作者", "封面图", "正文内容", "浏览次数", "发布状态", "创建时间"] },
            favorites: { name: "收藏记录", attrs: ["收藏ID", "用户ID", "收藏类型", "目标ID", "目标名称", "目标描述", "目标图片", "创建时间"] },
            admin: { name: "管理员", attrs: ["用户ID", "用户名", "登录密码", "昵称", "角色权限", "手机号", "状态", "创建时间"] }
        };

        const cvs = document.getElementById('cvs');
        const ctx = cvs.getContext('2d');

        // State
        let nodes = [];       // { id, label, x, y, w, h, isCenter, color }
        let dragging = null;  // { node, offX, offY }
        let currentKey = 'user';

        // Sizing helpers
        const PAD_X = 18, PAD_Y = 10;
        const ELLIPSE_RY = 18;
        const getFONT = (s) => `${14 * s}px 'Microsoft YaHei', SimSun, sans-serif`;
        const getFONT_CENTER = (s) => `bold ${18 * s}px 'Microsoft YaHei', SimSun, sans-serif`;
        // Default scale=1 aliases for existing code
        const FONT = getFONT(1);
        const FONT_CENTER = getFONT_CENTER(1);

        function measureText(text, font) {
            ctx.font = font;
            return ctx.measureText(text).width;
        }

        function initCanvas() {
            const wrap = cvs.parentElement;
            cvs.width = wrap.clientWidth;
            cvs.height = wrap.clientHeight - cvs.previousElementSibling.offsetHeight - cvs.nextElementSibling.offsetHeight;
        }

        function defaultPositions(attrs) {
            const cx = cvs.width / 2;
            const cy = cvs.height / 2;
            const half = Math.ceil(attrs.length / 2);
            const positions = [];

            const makeRow = (items, yOffset) => {
                const total = items.length;
                const spacing = Math.min(130, (cvs.width - 60) / Math.max(total, 1));
                const startX = cx - (total - 1) * spacing / 2;
                items.forEach((_, i) => positions.push({ x: startX + i * spacing, y: cy + yOffset }));
            };

            const above = attrs.slice(0, half);
            const below = attrs.slice(half);
            makeRow(above, -160);
            makeRow(below, 160);
            return positions;
        }

        function buildNodes(key) {
            const data = ENTITIES[key];
            const cx = cvs.width / 2, cy = cvs.height / 2;

            // center node
            const cw = measureText(data.name, FONT_CENTER) + PAD_X * 2;
            const ch = 34;

            const result = [{
                id: 0, label: data.name, isCenter: true,
                x: cx, y: cy, w: cw, h: ch,
                color: '#fffbe6', border: '#d4a017', textColor: '#333'
            }];

            const positions = defaultPositions(data.attrs);
            data.attrs.forEach((attr, i) => {
                const ew = measureText(attr, FONT) + PAD_X * 2;
                result.push({
                    id: i + 1, label: attr, isCenter: false, isPK: i === 0,
                    x: positions[i].x, y: positions[i].y,
                    w: ew, h: ELLIPSE_RY * 2,
                    color: '#fff', border: '#555', textColor: '#222'
                });
            });
            return result;
        }

        function getNodeColor(node) {
            if (node.isCenter) return { fill: '#fffbe6', stroke: '#d4a017' };
            const center = nodes.find(n => n.isCenter);
            if (!center) return { fill: '#fff', stroke: '#555' };
            if (node.y < center.y - 10) return { fill: '#f6ffed', stroke: '#52c41a' };
            if (node.y > center.y + 10) return { fill: '#e6f7ff', stroke: '#1890ff' };
            return { fill: '#fff', stroke: '#555' };
        }

        // 通用绘制函数，支持任意 scale（用于高清导出）
        function drawAll(targetCtx, nodeList, scale) {
            const s = scale || 1;
            const ery = ELLIPSE_RY * s;
            const center = nodeList.find(n => n.isCenter);
            targetCtx.clearRect(0, 0, targetCtx.canvas.width, targetCtx.canvas.height);

            // Edges first
            nodeList.forEach(n => {
                if (n.isCenter) return;
                targetCtx.beginPath();
                targetCtx.strokeStyle = '#555';
                targetCtx.lineWidth = 1.5 * s;
                targetCtx.moveTo(center.x * s, center.y * s);
                targetCtx.lineTo(n.x * s, n.y * s);
                targetCtx.stroke();
            });

            // Nodes
            nodeList.forEach(n => {
                const { fill, stroke } = getNodeColor(n);
                targetCtx.save();
                if (n.isCenter) {
                    const x = (n.x - n.w / 2) * s, y = (n.y - n.h / 2) * s;
                    const w = n.w * s, h = n.h * s;
                    targetCtx.fillStyle = fill;
                    targetCtx.strokeStyle = stroke;
                    targetCtx.lineWidth = 2.5 * s;
                    targetCtx.beginPath();
                    targetCtx.roundRect ? targetCtx.roundRect(x, y, w, h, 3 * s) : targetCtx.rect(x, y, w, h);
                    targetCtx.fill(); targetCtx.stroke();
                    targetCtx.font = getFONT_CENTER(s);
                    targetCtx.fillStyle = '#333';
                    targetCtx.textAlign = 'center';
                    targetCtx.textBaseline = 'middle';
                    targetCtx.fillText(n.label, n.x * s, n.y * s);
                } else {
                    targetCtx.fillStyle = fill;
                    targetCtx.strokeStyle = stroke;
                    targetCtx.lineWidth = 1.5 * s;
                    targetCtx.beginPath();
                    targetCtx.ellipse(n.x * s, n.y * s, (n.w / 2) * s, ery, 0, 0, Math.PI * 2);
                    targetCtx.fill(); targetCtx.stroke();
                    targetCtx.font = getFONT(s);
                    targetCtx.fillStyle = '#222';
                    targetCtx.textAlign = 'center';
                    targetCtx.textBaseline = 'middle';
                    targetCtx.fillText(n.label, n.x * s, n.y * s);
                    if (n.isPK) {
                        const tw = targetCtx.measureText(n.label).width;
                        targetCtx.beginPath();
                        targetCtx.moveTo(n.x * s - tw / 2, n.y * s + 8 * s);
                        targetCtx.lineTo(n.x * s + tw / 2, n.y * s + 8 * s);
                        targetCtx.stroke();
                    }
                }
                targetCtx.restore();
            });
        }

        function draw() {
            drawAll(ctx, nodes, 1);
        }

        function loadEntity(key) {
            currentKey = key;
            initCanvas();
            nodes = buildNodes(key);
            draw();
            const data = ENTITIES[key];
            setStatus(`已加载：${data.name}（${data.attrs.length} 个属性）· 拖动椭圆到上方/下方后点击"生成代码"`);
            document.getElementById('codeOut').value = '';
        }

        function hitTest(x, y) {
            // Reverse order so top nodes get priority
            for (let i = nodes.length - 1; i >= 0; i--) {
                const n = nodes[i];
                if (n.isCenter) continue;
                const dx = x - n.x, dy = y - n.y;
                if ((dx * dx) / ((n.w / 2) * (n.w / 2)) + (dy * dy) / (ELLIPSE_RY * ELLIPSE_RY) <= 1) {
                    return n;
                }
            }
            return null;
        }

        function getXY(e) {
            const r = cvs.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - r.left, y: t.clientY - r.top };
        }

        cvs.addEventListener('mousedown', e => {
            const { x, y } = getXY(e);
            const n = hitTest(x, y);
            if (n) { dragging = { node: n, offX: x - n.x, offY: y - n.y }; cvs.style.cursor = 'grabbing'; }
        });
        cvs.addEventListener('mousemove', e => {
            const { x, y } = getXY(e);
            if (dragging) {
                dragging.node.x = x - dragging.offX;
                dragging.node.y = y - dragging.offY;
                draw();
            } else {
                cvs.style.cursor = hitTest(x, y) ? 'grab' : 'default';
            }
        });
        cvs.addEventListener('mouseup', () => { dragging = null; cvs.style.cursor = 'default'; });
        cvs.addEventListener('mouseleave', () => { dragging = null; });

        // Touch support
        cvs.addEventListener('touchstart', e => { e.preventDefault(); const { x, y } = getXY(e); const n = hitTest(x, y); if (n) dragging = { node: n, offX: x - n.x, offY: y - n.y }; }, { passive: false });
        cvs.addEventListener('touchmove', e => { e.preventDefault(); if (!dragging) return; const { x, y } = getXY(e); dragging.node.x = x - dragging.offX; dragging.node.y = y - dragging.offY; draw(); }, { passive: false });
        cvs.addEventListener('touchend', () => { dragging = null; });

        function generateCode() {
            const data = ENTITIES[currentKey];
            const center = nodes.find(n => n.isCenter);
            const above = [], below = [];
            nodes.forEach(n => {
                if (n.isCenter) return;
                if (n.y < center.y) above.push(n);
                else below.push(n);
            });

            let code = `@startuml\nskinparam handwritten false\nskinparam defaultFontSize 13\nskinparam rectangle {\n  BackgroundColor #FEFECE\n  BorderColor #A80036\n  FontStyle bold\n}\nskinparam usecase {\n  BackgroundColor #FFFFFF\n  BorderColor #333333\n}\n\n`;

            if (above.length) {
                code += `' ===== 上方属性 =====\n`;
                above.forEach((n, i) => {
                    let label = n.isPK ? `<u>${n.label}</u>` : n.label;
                    code += `usecase "${label}" as up${i + 1}\n`;
                });
                code += '\n';
            }
            code += `' ===== 中心实体 =====\nrectangle "${data.name}" as e\n\n`;
            if (below.length) {
                code += `' ===== 下方属性 =====\n`;
                below.forEach((n, i) => {
                    let label = n.isPK ? `<u>${n.label}</u>` : n.label;
                    code += `usecase "${label}" as dn${i + 1}\n`;
                });
                code += '\n';
            }
            if (above.length) {
                code += `' ===== 隐藏箭头（上方）=====\n`;
                above.forEach((_, i) => code += `up${i + 1} -[hidden]- e\n`);
                code += '\n';
            }
            if (below.length) {
                code += `' ===== 隐藏箭头（下方）=====\n`;
                below.forEach((_, i) => code += `e -[hidden]- dn${i + 1}\n`);
                code += '\n';
            }
            code += `' ===== 实际连线 =====\n`;
            above.forEach((_, i) => code += `e -- up${i + 1}\n`);
            below.forEach((_, i) => code += `e -- dn${i + 1}\n`);
            code += `@enduml`;

            document.getElementById('codeOut').value = code;
            // Redraw with colors
            draw();
            setStatus(`✅ 代码生成完成！上方 ${above.length} 个，下方 ${below.length} 个 · 点击"复制代码"粘贴到 plantuml.com`);
        }

        function copyCode() {
            const ta = document.getElementById('codeOut');
            if (!ta.value) { generateCode(); }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(ta.value).then(() => setStatus('✅ 已复制到剪贴板！'));
            } else {
                ta.select(); document.execCommand('copy'); setStatus('✅ 已复制！');
            }
        }

        // 自动裁剪：扫描像素找到非白色内容边界，加 padding 后裁填
        function autoCrop(srcCanvas, padding) {
            const pad = padding || 40;
            const w = srcCanvas.width, h = srcCanvas.height;
            const ctx2 = srcCanvas.getContext('2d');
            const data = ctx2.getImageData(0, 0, w, h).data;

            let minX = w, maxX = 0, minY = h, maxY = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                    // 不是纯白色（存在内容）
                    if (a > 0 && !(r > 250 && g > 250 && b > 250)) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            // 加上边距
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(w - 1, maxX + pad);
            maxY = Math.min(h - 1, maxY + pad);

            const cropW = maxX - minX + 1;
            const cropH = maxY - minY + 1;

            // 创建裁剪后的 Canvas
            const out = document.createElement('canvas');
            out.width = cropW;
            out.height = cropH;
            const outCtx = out.getContext('2d');
            outCtx.fillStyle = '#fff';
            outCtx.fillRect(0, 0, cropW, cropH);
            outCtx.drawImage(srcCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
            return out;
        }

        function downloadPNG() {
            const SCALE = 3;
            const off = document.createElement('canvas');
            off.width = cvs.width * SCALE;
            off.height = cvs.height * SCALE;
            const oc = off.getContext('2d');
            oc.fillStyle = '#fff';
            oc.fillRect(0, 0, off.width, off.height);
            drawAll(oc, nodes, SCALE);
            // 自动裁剪多余空白（边距40px）
            const cropped = autoCrop(off, 40);
            const link = document.createElement('a');
            link.download = ENTITIES[currentKey].name + '实体属性图.png';
            link.href = cropped.toDataURL('image/png');
            link.click();
            setStatus('✅ 已下载高清PNG（已自动裁剪空白）');
        }

        function resetLayout() { loadEntity(currentKey); }

        function setStatus(msg) { document.getElementById('status').textContent = msg; }

        // 批量导出：依次渲染12个实体并下载高清PNG
        function batchExportAll(btn) {
            const keys = Object.keys(ENTITIES);
            let idx = 0;
            btn.disabled = true;
            btn.textContent = '导出中...';

            function exportNext() {
                if (idx >= keys.length) {
                    btn.disabled = false;
                    btn.textContent = '📦 批量导出全部12张';
                    setStatus(`✅ 批量导出完成！共 ${keys.length} 张高清PNG，请查看下载文件夹`);
                    // 恢复当前选中的实体
                    loadEntity(currentKey);
                    return;
                }
                const key = keys[idx];
                // 加载该实体（会重建nodes）
                currentKey = key;
                initCanvas();
                nodes = buildNodes(key);
                draw();

                setStatus(`正在导出 (${idx + 1}/${keys.length})：${ENTITIES[key].name}实体...`);

                // 等一帧确保绘制完成后再导出
                requestAnimationFrame(() => {
                    const SCALE = 3;
                    const off = document.createElement('canvas');
                    off.width = cvs.width * SCALE;
                    off.height = cvs.height * SCALE;
                    const oc = off.getContext('2d');
                    oc.fillStyle = '#fff';
                    oc.fillRect(0, 0, off.width, off.height);
                    drawAll(oc, nodes, SCALE);
                    // 自动裁剪多余空白
                    const cropped = autoCrop(off, 40);

                    const link = document.createElement('a');
                    link.download = `${String(idx + 1).padStart(2, '0')}_${ENTITIES[key].name}实体属性图.png`;
                    link.href = cropped.toDataURL('image/png');
                    link.click();

                    idx++;
                    // 间隔300ms再导出下一张，避免浏览器阻塞
                    setTimeout(exportNext, 300);
                });
            }

            exportNext();
        }

        window.addEventListener('resize', () => loadEntity(currentKey));
        window.onload = () => loadEntity('user');
    </script>
</body>

</html>
